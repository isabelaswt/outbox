<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aprovação Incom · OUTBOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f2ef;--panel:#fff;--ink:#1d1d1f;--muted:#7a7a7e;--line:#e6e3de;--soft:#f7f6f3;--accent:#9a7a4f;
  --ok:#2f7d4f;--okBg:#e7f3ec;--aj:#b5651d;--ajBg:#fbefe2;--feito:#3b5fa8;--feitoBg:#e8eef9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
button,textarea,select{font:inherit;color:inherit}
.top{height:54px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
.top h1 small{font-weight:400;color:var(--muted);margin-left:6px}
.prog{display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:#cfcac2;flex:none}
.dot.ok{background:var(--ok)}.dot.ajustar{background:var(--aj)}.dot.feito{background:var(--feito)}
.top .sp{flex:1}
.top select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--panel)}
.top a{color:var(--muted);text-decoration:none;white-space:nowrap}.top a:hover{color:var(--ink)}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;height:calc(100vh - 54px)}
.list{grid-row:1/3;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:6px 0 40px}
.list h3{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 14px 4px;font-weight:600}
.it{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;border-left:3px solid transparent}
.it:hover{background:var(--soft)}
.it.sel{background:var(--soft);border-left-color:var(--ink)}
.it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .n{color:var(--muted);font-size:11px}
.photos{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;border-right:1px solid var(--line);background:#fafaf8}
.big{position:relative;display:grid;place-items:center;min-height:0;overflow:hidden;cursor:grab;touch-action:none;user-select:none}
.big.drag{cursor:grabbing}
.big img{max-width:100%;max-height:100%;object-fit:contain;display:block;transform-origin:center;will-change:transform;-webkit-user-drag:none;pointer-events:none}
.zoomBar{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;z-index:2}
.zoomBar button{border:1px solid var(--line);background:rgba(255,255,255,.94);border-radius:7px;min-width:30px;height:28px;padding:0 8px;cursor:pointer;font-size:12px;color:#444}
.zoomBar button:hover{border-color:#cbc5bb}
.zoomBar .z{min-width:46px;cursor:default;color:var(--muted)}
.big .lbl{position:absolute;left:12px;top:10px;}.view3d .lbl{position:absolute;right:12px;top:10px;}.big .lbl,.view3d .lbl{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:12px;color:#555;z-index:2}
.empty{color:var(--muted);text-align:center;padding:30px}
.thumbs{display:flex;gap:6px;padding:8px;overflow-x:auto;border-top:1px solid var(--line);background:var(--panel)}
.thumbs button{flex:none;width:64px;height:64px;border:2px solid transparent;border-radius:8px;padding:0;background:#fff;cursor:pointer;overflow:hidden;position:relative}
.thumbs button.on{border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:contain}
.thumbs .cat{position:absolute;bottom:0;left:0;right:0;font-size:9px;background:rgba(0,0,0,.6);color:#fff;text-align:center}
.view3d{position:relative;min-height:0;background:#f1f0ed}
.view3d iframe{width:100%;height:100%;border:0;display:block}
.view3d .wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);background:#f1f0ed}
.decide{grid-column:2/4;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:12px 16px;max-height:42vh}
.decide h2{font-size:16px;margin:0 0 2px;font-weight:600}
.decide .meta{color:var(--muted);font-size:12px;margin-bottom:10px}
.btns{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px}
.btn:hover{border-color:#cbc5bb}
.btn.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ajustar.on{background:var(--aj);border-color:var(--aj);color:#fff}
.btn.send{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
textarea{width:100%;min-height:70px;resize:vertical;border:1px solid var(--line);border-radius:9px;padding:9px 10px;outline:none;background:#fff}
textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;margin-top:6px}.row .tip{color:var(--muted);font-size:11.5px;flex:1}
.thread{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:8px}
.msg{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--soft)}
.msg.claude{background:var(--feitoBg);border-color:#d6e0f3}
.msg .h{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:3px;flex-wrap:wrap}
.msg .h b{color:var(--ink);font-weight:600}
.msg p{margin:0;white-space:pre-wrap}
.tag{font-size:11px;border-radius:6px;padding:1px 7px;font-weight:600}
.tag.ok{background:var(--okBg);color:var(--ok)}.tag.ajustar{background:var(--ajBg);color:var(--aj)}.tag.feito{background:var(--feitoBg);color:var(--feito)}.tag.x{background:#eee;color:#666}
.gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9}
.gate div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 28px;max-width:420px;text-align:center}
.gate a{display:inline-block;margin-top:12px;background:var(--ink);color:#fff;text-decoration:none;border-radius:9px;padding:9px 16px;font-weight:600}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:9px;padding:8px 14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.toast.show{opacity:1}
kbd{font:inherit;font-size:11px;background:var(--soft);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px}
</style>
</head>
<body>
<div class="top">
  <h1>Aprovação Incom <small id="ver"></small></h1>
  <div class="prog" id="prog"></div>
  <span class="sp"></span>
  <select id="linha" title="Linha"></select>
  <a href="index.html">← OUTBOX</a>
</div>
<div class="wrap">
  <nav class="list" id="list"></nav>
  <section class="photos"><div class="big" id="big"></div><div class="thumbs" id="thumbs"></div></section>
  <section class="view3d"><span class="lbl">OUTBOX · render ao vivo</span><iframe id="app" src="about:blank" title="Render do OUTBOX"></iframe><div class="wait" id="wait">Abrindo o OUTBOX…</div></section>
  <section class="decide">
    <div>
      <h2 id="nome"></h2>
      <div class="meta" id="meta"></div>
      <div class="btns">
        <button class="btn ok" id="bOk" title="Aprovar (A)">✓ Aprovar</button>
        <button class="btn ajustar" id="bAj" title="Pedir ajuste (R)">✎ Ajustar</button>
        <button class="btn" id="bPrev" title="Anterior (←)">←</button><button class="btn" id="bNext" title="Próximo (→)">→</button>
      </div>
      <textarea id="txt" placeholder="O que está diferente da foto? (fechamento, onde começa cada peça, arredondamentos, cor, conteúdo…)"></textarea>
      <div class="row"><span class="tip">Enviar com <kbd>⌘</kbd>+<kbd>Enter</kbd>. Comentar sem escolher ainda também vale.</span><button class="btn send" id="bSend">Enviar</button></div>
    </div>
    <div class="thread" id="thread"></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="js/revisao.js?v=5"></script>
</body>
</html>
